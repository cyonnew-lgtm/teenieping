<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>캐치! 티니핑 한글 놀이 게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-main: #ff5c93;
      --pink-dark: #e03572;
      --pink-light: #ffe4ef;
      --pink-bg: #fff5f9;
      --purple-main: #9b5de5;
      --purple-dark: #753bbd;
      --yellow-main: #ffca3a;
      --mint-main: #00bbf9;
      --green-correct: #2ec4b6;
      --red-wrong: #ff6b6b;
      --text-dark: #3d2645;
      --card-shadow: 0 12px 28px rgba(255, 92, 147, 0.18);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Jua', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: radial-gradient(circle at top, #ffe3f1 0%, #fff6fa 55%, #f3e8ff 100%);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 배경 장식 애니메이션 */
    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-icon {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.25;
      animation: floatUp 12s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg) scale(0.8); opacity: 0; }
      15% { opacity: 0.28; }
      85% { opacity: 0.28; }
      100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .screen {
      display: none;
      animation: fadeIn 0.35s ease-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= 홈 화면 ================= */
    .hero-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .hero-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff7eb3, #ff4d88);
      color: #fff;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 1.05rem;
      box-shadow: 0 4px 12px rgba(255, 77, 136, 0.35);
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: clamp(2.1rem, 5vw, 3.2rem);
      margin: 4px 0 8px;
      color: #d81b60;
      text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(216, 27, 96, 0.22);
      letter-spacing: 1px;
    }

    .hero-subtitle {
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      color: #6d4c7d;
      margin: 0;
    }

    /* 옵션 바 (문제 수 & 음성 설정) */
    .settings-bar {
      background: rgba(255, 255, 255, 0.9);
      border: 3px solid #ffc2d9;
      border-radius: 22px;
      padding: 14px 20px;
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 18px rgba(255, 92, 147, 0.1);
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .setting-label {
      font-size: 1.15rem;
      color: #ad1457;
      margin-right: 4px;
    }

    .pill-btn {
      font-family: inherit;
      font-size: 1.05rem;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid #ff9ec2;
      background: #fff;
      color: #c2185b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill-btn.active {
      background: var(--pink-main);
      color: #fff;
      border-color: var(--pink-main);
      box-shadow: 0 4px 10px rgba(255, 92, 147, 0.35);
      transform: scale(1.04);
    }

    /* 시즌 1~6 + 종합 (7개 버튼 그리드) */
    .season-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 720px) {
      .season-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .season-btn {
      position: relative;
      font-family: inherit;
      background: #fff;
      border: 4px solid #ffb3d1;
      border-radius: 26px;
      padding: 16px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 0 #f48fb1, 0 12px 24px rgba(255, 92, 147, 0.16);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s;
      overflow: hidden;
    }

    .season-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 0 #f06292, 0 16px 28px rgba(255, 92, 147, 0.26);
      border-color: var(--pink-main);
    }

    .season-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #f06292;
    }

    .season-btn .season-tag {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 8px;
    }

    .season-btn .thumb-wrap {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0 10px;
      background: radial-gradient(circle, #fff0f6 0%, transparent 70%);
      border-radius: 50%;
    }

    .season-btn .thumb-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.12));
      transition: transform 0.25s ease;
    }

    .season-btn:hover .thumb-wrap img {
      transform: scale(1.1) rotate(-3deg);
    }

    .season-btn .season-name {
      font-size: 1.45rem;
      color: var(--text-dark);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .season-btn .season-count {
      font-size: 1rem;
      color: #8e6c9e;
    }

    /* 시즌별 테마 컬러 */
    .season-1 .season-tag { background: #ff5c93; }
    .season-2 .season-tag { background: #00b4d8; }
    .season-3 .season-tag { background: #9b5de5; }
    .season-4 .season-tag { background: #ff9f1c; }
    .season-5 .season-tag { background: #4361ee; }
    .season-6 .season-tag { background: #f15bb5; }

    /* 7번째 종합 버튼: 전체 가로 폭 차지 */
    .season-all {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #fff9db 0%, #ffe3f1 50%, #e8d7ff 100%);
      border: 4px solid #ff85b3;
      box-shadow: 0 9px 0 #e05288, 0 14px 30px rgba(224, 82, 136, 0.25);
      flex-direction: row;
      justify-content: center;
      gap: 24px;
      padding: 18px 24px;
    }

    .season-all .season-tag {
      background: linear-gradient(90deg, #ff4d88, #9b5de5);
      font-size: 1.05rem;
    }

    .season-all .multi-thumbs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .season-all .multi-thumbs img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.14));
    }

    @media (max-width: 600px) {
      .season-all {
        flex-direction: column;
        gap: 10px;
      }
      .season-all .multi-thumbs img {
        width: 52px;
        height: 52px;
      }
    }

    /* ================= 퀴즈 게임 화면 ================= */
    .quiz-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .nav-btn {
      font-family: inherit;
      font-size: 1.15rem;
      background: #fff;
      color: #c2185b;
      border: 3px solid #ff9ec2;
      border-radius: 16px;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 #f48fb1;
      transition: transform 0.1s;
    }

    .nav-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #f48fb1;
    }

    .status-pills {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      background: #fff;
      border: 3px solid #ffc2d9;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 1.15rem;
      color: #ad1457;
      box-shadow: 0 4px 10px rgba(255, 92, 147, 0.12);
    }

    .progress-track {
      width: 100%;
      height: 16px;
      background: #ffe0ec;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 2px solid #ffb3d1;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff5c93, #ffca3a);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    /* 문제 카드 */
    .quiz-card {
      background: rgba(255, 255, 255, 0.95);
      border: 4px solid #ffb3d1;
      border-radius: 30px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      text-align: center;
      position: relative;
    }

    .question-prompt {
      font-size: clamp(1.4rem, 3.5vw, 1.9rem);
      color: #ad1457;
      margin: 0 0 10px;
    }

    .char-meta-badges {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .meta-badge {
      font-size: 0.95rem;
      padding: 4px 12px;
      border-radius: 999px;
      background: #f8e8ff;
      color: #6a1b9a;
    }

    .image-stage {
      position: relative;
      width: 100%;
      height: clamp(230px, 38vh, 320px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #fff0f7 0%, #ffffff 72%);
      border-radius: 24px;
      margin: 6px auto 14px;
      overflow: hidden;
    }

    .image-stage img {
      max-width: 92%;
      max-height: 92%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(216, 27, 96, 0.2));
      animation: gentleBounce 3s ease-in-out infinite;
    }

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.03); }
    }

    /* 소리 듣기 & 힌트 도구 모음 */
    .helper-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .helper-btn {
      font-family: inherit;
      font-size: 1.15rem;
      padding: 9px 18px;
      border-radius: 999px;
      border: 3px solid #ffd166;
      background: #fff9db;
      color: #b45309;
      cursor: pointer;
      box-shadow: 0 4px 0 #f59e0b;
      transition: transform 0.12s;
    }

    .helper-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #f59e0b;
    }

    .helper-btn.voice-btn {
      border-color: #90e0ef;
      background: #e0f7fa;
      color: #0077b6;
      box-shadow: 0 4px 0 #00b4d8;
    }

    .hint-box {
      display: none;
      background: #fff8e6;
      border: 2px dashed #ffb703;
      border-radius: 16px;
      padding: 10px 16px;
      margin: 0 auto 14px;
      max-width: 640px;
      font-size: 1.15rem;
      color: #9a3412;
    }

    .hint-box.show {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    /* 한글 음절 학습 박스 (정답 시 노출) */
    .syllable-learn-box {
      display: none;
      margin: 12px auto 16px;
      padding: 14px;
      background: linear-gradient(135deg, #e0fbfc, #fcefb4);
      border: 3px solid #2ec4b6;
      border-radius: 22px;
      max-width: 680px;
    }

    .syllable-learn-box.show {
      display: block;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .syllable-blocks {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .syllable-block {
      width: 64px;
      height: 64px;
      background: #fff;
      border: 3px solid #ff5c93;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #d81b60;
      box-shadow: 0 4px 0 #f48fb1;
    }

    .syllable-desc {
      font-size: 1.15rem;
      color: #1d3557;
      margin: 6px 0 0;
    }

    /* 4지선다 큰 객관식 버튼 */
    .choices-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 8px;
    }

    @media (max-width: 560px) {
      .choices-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    .choice-btn {
      font-family: inherit;
      font-size: clamp(1.85rem, 4.5vw, 2.55rem);
      padding: 20px 18px;
      border-radius: 24px;
      border: 4px solid #ffb3d1;
      background: #fff;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 0 #f48fb1, 0 10px 20px rgba(255, 92, 147, 0.14);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s, border-color 0.2s;
      letter-spacing: 2px;
    }

    .choice-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: var(--pink-main);
      background: #fff9fc;
    }

    .choice-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #f48fb1;
    }

    .choice-num {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffe0ec;
      color: #d81b60;
      font-size: 1.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .choice-text {
      flex: 1;
      text-align: center;
      word-break: keep-all;
    }

    .choice-speak {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f3e8ff;
      color: #7b2cbf;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .choice-speak:hover {
      transform: scale(1.15);
      background: #e0c3fc;
    }

    .choice-btn.correct {
      background: #d8f3dc !important;
      border-color: #2ec4b6 !important;
      color: #0f5132 !important;
      box-shadow: 0 8px 0 #2ec4b6 !important;
      animation: pulseCorrect 0.5s ease;
    }

    .choice-btn.wrong {
      background: #ffe3e3 !important;
      border-color: #ff6b6b !important;
      color: #a4161a !important;
      box-shadow: 0 4px 0 #ff6b6b !important;
      opacity: 0.65;
      animation: shakeWrong 0.4s ease;
    }

    @keyframes pulseCorrect {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .feedback-banner {
      margin-top: 16px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .feedback-msg {
      font-size: 1.45rem;
      color: #d81b60;
    }

    .next-btn {
      display: none;
      font-family: inherit;
      font-size: 1.45rem;
      padding: 12px 30px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ff5c93, #9b5de5);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 0 #753bbd, 0 10px 20px rgba(155, 93, 229, 0.35);
      animation: bounceNext 1.2s infinite;
    }

    .next-btn.show {
      display: inline-block;
    }

    @keyframes bounceNext {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* ================= 결과 화면 ================= */
    .result-card {
      background: #fff;
      border: 5px solid #ffb3d1;
      border-radius: 32px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: var(--card-shadow);
    }

    .result-crown {
      font-size: 4.2rem;
      margin-bottom: 6px;
    }

    .result-title {
      font-size: 2.4rem;
      color: #d81b60;
      margin: 0 0 10px;
    }

    .result-score {
      font-size: 1.6rem;
      color: #6a1b9a;
      margin-bottom: 20px;
    }

    .learned-words-title {
      font-size: 1.25rem;
      color: #8e6c9e;
      margin-bottom: 12px;
    }

    .learned-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding: 10px;
      background: #fff5f9;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .learned-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 2px solid #ffb3d1;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .learned-chip:hover {
      transform: scale(1.06);
      border-color: var(--pink-main);
    }

    .learned-chip img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .action-big-btn {
      font-family: inherit;
      font-size: 1.4rem;
      padding: 14px 28px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      color: #fff;
      background: var(--pink-main);
      box-shadow: 0 6px 0 var(--pink-dark);
    }

    .action-big-btn.secondary {
      background: var(--purple-main);
      box-shadow: 0 6px 0 var(--purple-dark);
    }

    /* 축하 꽃가루 캔버스 */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div class="bg-decor" id="bg-decor"></div>

  <div class="app-container">
    <!-- ==================== 1. 메인 시즌 선택 화면 ==================== -->
    <section id="home-screen" class="screen active">
      <div class="hero-header">
        <span class="hero-badge">✨ 우리 아이 한글 쑥쑥 프로젝트 ✨</span>
        <h1 class="hero-title">💖 캐치! 티니핑 한글 놀이 💖</h1>
        <p class="hero-subtitle">좋아하는 시즌을 고르고 티니핑 친구들의 이름을 맞춰보세요!</p>
      </div>

      <div class="settings-bar">
        <div class="setting-group">
          <span class="setting-label">🎯 문제 수:</span>
          <button class="pill-btn active" onclick="setQuestionCount(10, this)">10문제</button>
          <button class="pill-btn" onclick="setQuestionCount(20, this)">20문제</button>
          <button class="pill-btn" onclick="setQuestionCount(999, this)">전체 다 풀기</button>
        </div>
        <div class="setting-group">
          <span class="setting-label">🔊 한글 읽어주기:</span>
          <button id="tts-toggle-btn" class="pill-btn active" onclick="toggleTTS()">하츄핑 목소리 켜짐 🔊</button>
        </div>
      </div>

      <div class="season-grid">
        <!-- 시즌 1 -->
        <button class="season-btn season-1" onclick="startGame(1)">
          <span class="season-tag">시즌 1</span>
          <div class="thumb-wrap">
            <img src="image/1기_캐치_티니핑/01_하츄핑.png" alt="하츄핑" />
          </div>
          <div class="season-name">1기 캐치! 티니핑</div>
          <div class="season-count">큐브 티니핑 · 45마리</div>
        </button>

": "가면 / 다른 사람이나 사물의 모습으로 똑같이 변신", "img": "image/1기_캐치_티니핑/34_또까핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "35", "name": "플라핑", "grade": "일반", "keyword": "꽃", "desc": "장미꽃 / 식물을 조종하거나 대상을 꽃으로 만듦", "img": "image/1기_캐치_티니핑/35_플라핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "36", "name": "토이핑", "grade": "일반", "keyword": "장난감", "desc": "요요 / 대상이나 사물을 장난감으로 변화시킴", "img": "image/1기_캐치_티니핑/36_토이핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "37", "name": "노라핑", "grade": "일반", "keyword": "놀이(형)", "desc": "게임기 / 일이나 공부를 멈추고 놀게 만듦", "img": "image/1기_캐치_티니핑/37_노라핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "38", "name": "노리핑", "grade": "일반", "keyword": "놀이(동생)", "desc": "딸랑이 / 노라핑과 함께 따라다니며 놀이를 보조", "img": "image/1기_캐치_티니핑/38_노리핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "39", "name": "아휴핑", "grade": "일반", "keyword": "한숨", "desc": "나팔 / 나팔 소리를 들으면 한숨을 쉬며 좌절하게 함", "img": "image/1기_캐치_티니핑/39_아휴핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "40", "name": "똑똑핑", "grade": "일반", "keyword": "학구열", "desc": "큰 연필 / 거대한 연필과 책으로 공부에 집중시킴", "img": "image/1기_캐치_티니핑/40_똑똑핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "41", "name": "꽁꽁핑", "grade": "일반", "keyword": "냉동", "desc": "아이스크림 콘 / 대상이나 공간을 얼려버림", "img": "image/1기_캐치_티니핑/41_꽁꽁핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "42", "name": "찌릿핑", "grade": "일반", "keyword": "전기", "desc": "번개 지팡이 / 전기를 방출하고 감전시킴", "img": "image/1기_캐치_티니핑/42_찌릿핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "43", "name": "홀로핑", "grade": "일반", "keyword": "고독", "desc": "낚싯대 / 방어막을 치고 혼자 있게 만듦", "img": "image/1기_캐치_티니핑/43_홀로핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "44-1", "name": "악동핑", "grade": "빌런", "keyword": "흑화 / 이기심", "desc": "번개 풍선껌(악동핑) / 꽃가루 및 촉수 제어(앙대핑)", "img": "image/1기_캐치_티니핑/44-1_악동핑.png"}, {"season": 1, "seasonTitle": "1기 캐치! 티니핑", "code": "44-2", "name": "앙대핑", "grade": "빌런", "keyword": "흑화 / 이기심", "desc": "번개 풍선껌(악동핑) / 꽃가루 및 촉수 제어(앙대핑)", "img": "image/1기_캐치_티니핑/44-2_앙대핑.png"}];

    let selectedLimit = 10;
    let ttsEnabled = true;
    let currentSeasonMode = 'all';
    let pool = [];
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let answeredCurrent = false;
    let learnedList = [];

    // 배경 하트/별 장식 생성
    function initDecor() {
      const decor = document.getElementById('bg-decor');
      const icons = ['💖', '⭐', '🌸', '✨', '🎀', '💎', '👑'];
      for (let i = 0; i < 18; i++) {
        const span = document.createElement('span');
        span.className = 'floating-icon';
        span.textContent = icons[i % icons.length];
        span.style.left = (Math.random() * 96) + 'vw';
        span.style.animationDuration = (9 + Math.random() * 8) + 's';
        span.style.animationDelay = (-Math.random() * 12) + 's';
        decor.appendChild(span);
      }
    }
    initDecor();

    // 효과음 합성기 (Web Audio API - 외부 오디오 파일 불필요)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          const notes = [523.25, 659.25, 783.99, 1046.5]; // 도-미-솔-높은도
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.22, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.28);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.28);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.linearRampToValueAtTime(190, now + 0.25);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gain.gain.setValueAtTime(0.22, now + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 0.35);
          });
        }
      } catch (e) {}
    }

    // 귀여운 하츄핑 톤 음성 재생기 (고음역 Neural TTS MP3 우선 재생 + Web Speech 폴백)
    let currentAudio = null;

    function stopCurrentVoice() {
      if (currentAudio) {
        try {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        } catch (e) {}
        currentAudio = null;
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
    }

    function fallbackSpeak(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ko-KR';
        utter.rate = 1.05;
        utter.pitch = 1.65; // 귀여운 고음역
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function playVoiceFile(relPath, fallbackText, force = false) {
      if (!ttsEnabled && !force) return;
      stopCurrentVoice();
      try {
        const audio = new Audio(relPath);
        currentAudio = audio;
        audio.onerror = () => fallbackSpeak(fallbackText);
        audio.play().catch(() => fallbackSpeak(fallbackText));
      } catch (e) {
        fallbackSpeak(fallbackText);
      }
    }

    function speakName(name, force = false) {
      playVoiceFile(`audio/names/${encodeURIComponent(name)}.mp3`, name, force);
    }

    function speakCorrect(name, force = false) {
      playVoiceFile(`audio/correct/${encodeURIComponent(name)}.mp3`, `${name} 정답이에요`, force);
    }

    function speakChar(ch, force = false) {
      playVoiceFile(`audio/chars/${encodeURIComponent(ch)}.mp3`, ch, force);
    }

    function speakHint(name, keyword, force = false) {
      playVoiceFile(`audio/hints/${encodeURIComponent(name)}.mp3`, `힌트! ${keyword}의 티니핑이에요.`, force);
    }

    function speakText(text, force = false) {
      if (!ttsEnabled && !force) return;
      stopCurrentVoice();
      fallbackSpeak(text);
    }

    function setQuestionCount(count, btnEl) {
      selectedLimit = count;
      document.querySelectorAll('.settings-bar .setting-group:first-child .pill-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
    }

    function toggleTTS() {
      ttsEnabled = !ttsEnabled;
      const btn = document.getElementById('tts-toggle-btn');
      if (ttsEnabled) {
        btn.classList.add('active');
        btn.textContent = '하츄핑 목소리 켜짐 🔊';
        playVoiceFile('audio/common/tts_on.mp3', '하츄핑 목소리가 켜졌어요, 츄!', true);
      } else {
        btn.classList.remove('active');
        btn.textContent = '꺼짐 🔇';
        stopCurrentVoice();
      }
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startGame(seasonMode) {
      currentSeasonMode = seasonMode;
      if (seasonMode === 'all') {
        pool = [...TEENIEPINGS];
        document.getElementById('mode-title-pill').textContent = '🌟 종합 (1~6시즌)';
      } else {
        pool = TEENIEPINGS.filter(item => item.season === seasonMode);
        document.getElementById('mode-title-pill').textContent = pool[0]?.seasonTitle || `${seasonMode}기`;
      }

      const shuffled = shuffle(pool);
      const count = Math.min(selectedLimit, shuffled.length);
      questions = shuffled.slice(0, count);
      currentIndex = 0;
      score = 0;
      learnedList = [];

      showScreen('quiz-screen');
      renderQuestion();
    }

    function restartSameMode() {
      startGame(currentSeasonMode);
    }

    function goHome() {
      stopCurrentVoice();
      showScreen('home-screen');
    }

    function renderQuestion() {
      answeredCurrent = false;
      const q = questions[currentIndex];

      document.getElementById('progress-pill').textContent = `${currentIndex + 1} / ${questions.length}`;
      document.getElementById('score-pill').textContent = `💖 ${score}`;
      const pct = ((currentIndex) / questions.length) * 100;
      document.getElementById('progress-fill').style.width = `${pct}%`;

      document.getElementById('char-season-badge').textContent = q.seasonTitle;
      document.getElementById('char-grade-badge').textContent = `등급: ${q.grade}`;

      const imgEl = document.getElementById('quiz-image');
      imgEl.src = q.img;
      imgEl.alt = q.name;

      // 힌트 및 학습 상자 초기화
      const hintBox = document.getElementById('hint-box');
      hintBox.classList.remove('show');
      hintBox.innerHTML = `<strong>✨ 상징 키워드:</strong> ${q.keyword} <br/><strong>🪄 마법 특징:</strong> ${q.desc}`;

      const learnBox = document.getElementById('syllable-learn-box');
      learnBox.classList.remove('show');

      document.getElementById('feedback-msg').textContent = '아래 4개의 한글 버튼 중에서 알맞은 이름을 골라보세요!';
      document.getElementById('next-btn').classList.remove('show');

      // 오답 보기 3개 선정 (같은 시즌 우선, 이름 중복 제외)
      const otherCandidates = pool.filter(item => item.name !== q.name);
      const uniqueNamesMap = new Map();
      shuffle(otherCandidates).forEach(item => {
        if (!uniqueNamesMap.has(item.name)) {
          uniqueNamesMap.set(item.name, item);
        }
      });
      const distractors = Array.from(uniqueNamesMap.values()).slice(0, 3);
      const options = shuffle([q, ...distractors]);

      const grid = document.getElementById('choices-grid');
      grid.innerHTML = '';

      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `
          <span class="choice-num">${idx + 1}</span>
          <span class="choice-text">${opt.name}</span>
          <span class="choice-speak" title="글자 소리 듣기" onclick="event.stopPropagation(); speakName('${opt.name}', true);">🔊</span>
        `;
        btn.onclick = () => handleChoice(btn, opt, q);
        grid.appendChild(btn);
      });
    }

    function speakCurrentAnswer() {
      const q = questions[currentIndex];
      speakName(q.name, true);
    }

    function toggleHint() {
      const hintBox = document.getElementById('hint-box');
      hintBox.classList.toggle('show');
      const q = questions[currentIndex];
      if (hintBox.classList.contains('show')) {
        speakHint(q.name, q.keyword, true);
      } else {
        stopCurrentVoice();
      }
    }

    function handleChoice(btnEl, selectedOpt, correctOpt) {
      if (answeredCurrent) {
        // 이미 맞힌 뒤에도 버튼을 누르면 귀여운 하츄핑 톤으로 글자를 읽어줌
        speakName(selectedOpt.name, true);
        return;
      }

      if (selectedOpt.name === correctOpt.name) {
        answeredCurrent = true;
        score++;
        learnedList.push(correctOpt);
        btnEl.classList.add('correct');
        document.getElementById('score-pill').textContent = `💖 ${score}`;
        document.getElementById('progress-fill').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

        playSound('correct');
        fireConfetti(35);
        speakCorrect(correctOpt.name);

        document.getElementById('feedback-msg').innerHTML = `🎉 <strong>${correctOpt.name} 정답이에요!</strong>`;
        document.getElementById('next-btn').classList.add('show');

        // 한글 음절 블록 표시 (공백 제외한 글자 하나씩 큼직하게 표시)
        const blocksWrap = document.getElementById('syllable-blocks');
        blocksWrap.innerHTML = '';
        Array.from(correctOpt.name).forEach(ch => {
          if (ch === ' ') {
            const sp = document.createElement('div');
            sp.style.width = '16px';
            blocksWrap.appendChild(sp);
          } else {
            const b = document.createElement('div');
            b.className = 'syllable-block';
            b.textContent = ch;
            b.style.cursor = 'pointer';
            b.onclick = () => speakChar(ch, true);
            blocksWrap.appendChild(b);
          }
        });
        document.getElementById('syllable-desc').innerHTML =
          `💡 <strong>${correctOpt.name}</strong> (${correctOpt.keyword}) — ${correctOpt.desc}<br/><small>글자 네모 칸을 누르면 한 글자씩 귀여운 소리로 들을 수 있어요!</small>`;
        document.getElementById('syllable-learn-box').classList.add('show');
      } else {
        btnEl.classList.add('wrong');
        btnEl.disabled = true;
        speakName(selectedOpt.name);
        document.getElementById('feedback-msg').innerHTML =
          `<strong>${selectedOpt.name}</strong>`;
      }
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex >= questions.length) {
        showResults();
      } else {
        renderQuestion();
      }
    }

    function showResults() {
      showScreen('result-screen');
      playSound('fanfare');
      fireConfetti(90);
      playVoiceFile('audio/common/finish.mp3', '우와! 문제를 모두 풀었어요! 정말 잘했어요, 츄!');

      document.getElementById('result-score-text').innerHTML =
        `총 <strong>${questions.length}</strong>명의 티니핑 친구 이름을 모두 배웠어요! 💖`;

      const grid = document.getElementById('learned-grid');
      grid.innerHTML = '';
      learnedList.forEach(item => {
        const chip = document.createElement('div');
        chip.className = 'learned-chip';
        chip.innerHTML = `<img src="${item.img}" alt="${item.name}" /> <span>${item.name} 🔊</span>`;
        chip.onclick = () => speakName(item.name, true);
        grid.appendChild(chip);
      });
    }

    // 간단한 꽃가루(Confetti) 파티클 효과
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti(count = 40) {
      const colors = ['#ff5c93', '#ffca3a', '#00bbf9', '#9b5de5', '#2ec4b6', '#ff9f1c'];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: window.innerWidth / 2 + (Math.random() - 0.5) * 180,
          y: window.innerHeight * 0.45,
          vx: (Math.random() - 0.5) * 14,
          vy: -Math.random() * 12 - 4,
          size: 8 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          vrot: (Math.random() - 0.5) * 12,
          life: 80 + Math.random() * 30
        });
      }
      if (particles.length === count) {
        requestAnimationFrame(updateConfetti);
      }
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.rot += p.vrot;
        p.life -= 1;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        ctx.restore();
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length > 0) {
        requestAnimationFrame(updateConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
  </script>
</body>
</html>
