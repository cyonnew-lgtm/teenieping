<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>캐치! 티니핑 한글 놀이 게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-main: #ff5c93;
      --pink-dark: #e03572;
      --pink-light: #ffe4ef;
      --purple-main: #9b5de5;
      --purple-dark: #753bbd;
      --green-correct: #2ec4b6;
      --red-wrong: #ff6b6b;
      --text-dark: #3d2645;
      --card-shadow: 0 8px 20px rgba(255, 92, 147, 0.16);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      font-family: 'Jua', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: radial-gradient(circle at top, #ffe3f1 0%, #fff6fa 55%, #f3e8ff 100%);
      color: var(--text-dark);
      overflow-x: hidden;
      overscroll-behavior-x: none;
      touch-action: manipulation;
    }

    /* 배경 장식 애니메이션 */
    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-icon {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.22;
      animation: floatUp 12s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg) scale(0.8); opacity: 0; }
      15% { opacity: 0.25; }
      85% { opacity: 0.25; }
      100% { transform: translateY(-10vh) rotate(360deg) scale(1.1); opacity: 0; }
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 4px 8px 8px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      animation: fadeIn 0.25s ease-out;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= 1. 홈 화면 ================= */
    #home-screen {
      justify-content: space-between;
      overflow-y: auto;
      padding-bottom: 4px;
    }

    .hero-header {
      text-align: center;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .hero-title {
      font-size: clamp(1.45rem, 4.6vw, 2.2rem);
      margin: 2px 0;
      color: #d81b60;
      text-shadow: 0 2px 0 #fff, 0 4px 10px rgba(216, 27, 96, 0.2);
    }

    .hero-subtitle {
      font-size: clamp(0.84rem, 2.4vw, 1rem);
      color: #6d4c7d;
      margin: 0;
    }

    .settings-bar {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #ffc2d9;
      border-radius: 14px;
      padding: 6px 10px;
      margin-bottom: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .setting-label {
      font-size: 0.88rem;
      color: #ad1457;
    }

    .pill-btn {
      font-family: inherit;
      font-size: 0.84rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 2px solid #ff9ec2;
      background: #fff;
      color: #c2185b;
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--pink-main);
      color: #fff;
      border-color: var(--pink-main);
    }

    .season-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    @media (min-width: 640px) {
      .season-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
    }

    .season-btn {
      font-family: inherit;
      background: #fff;
      border: 3px solid #ffb3d1;
      border-radius: 18px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      box-shadow: 0 4px 0 #f48fb1;
      transition: transform 0.12s ease;
      min-height: 0;
    }

    .season-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #f48fb1;
    }

    .season-btn .thumb-wrap {
      width: clamp(48px, 11vw, 72px);
      height: clamp(48px, 11vw, 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #fff0f6 0%, transparent 70%);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .season-btn .thumb-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.12));
    }

    .season-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .season-btn .season-tag {
      display: inline-block;
      align-self: flex-start;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      color: #fff;
      margin-bottom: 2px;
    }

    .season-btn .season-name {
      font-size: clamp(0.96rem, 3vw, 1.2rem);
      color: var(--text-dark);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .season-btn .season-count {
      font-size: 0.78rem;
      color: #8e6c9e;
    }

    .season-1 .season-tag { background: #ff5c93; }
    .season-2 .season-tag { background: #00b4d8; }
    .season-3 .season-tag { background: #9b5de5; }
    .season-4 .season-tag { background: #ff9f1c; }
    .season-5 .season-tag { background: #4361ee; }
    .season-6 .season-tag { background: #f15bb5; }

    .season-all {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #fff9db 0%, #ffe3f1 50%, #e8d7ff 100%);
      border: 3px solid #ff85b3;
      box-shadow: 0 5px 0 #e05288;
      justify-content: center;
      text-align: center;
      padding: 8px 12px;
    }

    .season-all .season-info {
      align-items: center;
    }

    .season-all .season-tag {
      align-self: center;
      background: linear-gradient(90deg, #ff4d88, #9b5de5);
    }

    .season-all .multi-thumbs {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .season-all .multi-thumbs img {
      width: clamp(32px, 7.5vw, 46px);
      height: clamp(32px, 7.5vw, 46px);
      object-fit: contain;
    }

    /* ================= 2. 퀴즈 화면 ================= */
    #quiz-screen {
      height: 100%;
      justify-content: space-between;
      gap: 4px;
      overflow: hidden;
    }

    /* 최상단 바: 좌측에 정답듣기/힌트, 우측에 진행상태/홈 버튼 배치 (360px 화면에서도 좌우 스크롤 절대 없음!) */
    .quiz-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      flex-shrink: 0;
      width: 100%;
      min-width: 0;
      padding: 0;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
      min-width: 0;
    }

    .nav-btn {
      font-family: inherit;
      font-size: clamp(0.7rem, 2.5vw, 0.82rem);
      background: #fff;
      color: #c2185b;
      border: 1.5px solid #ff9ec2;
      border-radius: 999px;
      padding: 4px 7px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-pill {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #ffc2d9;
      border-radius: 999px;
      padding: 2px 6px;
      font-size: clamp(0.66rem, 2.3vw, 0.76rem);
      color: #ad1457;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 380px 미만 작은 화면에서는 시즌/등급 뱃지를 숨겨 상단 바 여유 공간 확보 */
    @media (max-width: 380px) {
      #char-season-badge {
        display: none;
      }
    }

    .helper-btn {
      font-family: inherit;
      font-size: clamp(0.95rem, 3.5vw, 1.3rem);
      padding: 5px 10px;
      border-radius: 999px;
      border: 2px solid #ffd166;
      background: #fff9db;
      color: #b45309;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 0 #f59e0b;
      flex-shrink: 0;
    }

    .helper-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #f59e0b;
    }

    .helper-btn.voice-btn {
      border-color: #90e0ef;
      background: #e0f7fa;
      color: #0077b6;
      box-shadow: 0 2px 0 #00b4d8;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: #ffe0ec;
      border-radius: 999px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff5c93, #ffca3a);
      transition: width 0.3s ease;
    }

    /* 메인 퀴즈 카드 */
    .quiz-card {
      background: rgba(255, 255, 255, 0.96);
      border: 3px solid #ffb3d1;
      border-radius: 22px;
      padding: 8px 10px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      min-height: 0;
      gap: 8px;
    }

    /* 제일 위: 순수 캐릭터 사진 영역 */
    .image-stage {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #fff0f7 0%, #ffffff 75%);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    /* 2단계 글자 맞추기 모드일 때: 남은 상단 공간을 꽉 채워 그림을 20% 이상 더 크게 표시 */
    .image-stage.puzzle-mode {
      flex: 1 1 26dvh;
      min-height: 110px;
    }

    .image-stage.puzzle-mode img {
      max-width: 98%;
      max-height: 98%;
    }

    .image-stage img {
      max-width: 94%;
      max-height: 95%;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(216, 27, 96, 0.2));
      animation: gentleBounce 3s ease-in-out infinite;
      transition: transform 0.25s ease;
    }

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }

    /* 힌트 팝업 (글씨 크기 2배 확대!) */
    .hint-box {
      display: none;
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      background: rgba(255, 248, 230, 0.97);
      border: 3px dashed #ffb703;
      border-radius: 16px;
      padding: 12px 16px;
      font-size: clamp(1.35rem, 4.4vw, 1.75rem);
      line-height: 1.35;
      color: #9a3412;
      z-index: 5;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
    }

    .hint-box.show {
      display: block;
    }

    /* 2단계 한글 글자 맞추기 슬롯 바 (갤럭시/아이폰 화면 폭에 100% 맞춰지면서 초대형 크기 유지!) */
    .syllable-learn-box {
      display: none;
      width: 100%;
      max-width: 100%;
      padding: 10px 6px;
      background: linear-gradient(180deg, #fff5fa 0%, #ffe8f3 100%);
      border: 3px solid #ff5c93;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(255, 92, 147, 0.22);
      flex-shrink: 0;
      overflow: hidden;
    }

    .syllable-learn-box.show {
      display: block;
      animation: popIn 0.25s ease-out;
    }

    .syllable-learn-box.completed {
      background: linear-gradient(180deg, #e8fcef 0%, #d8f3dc 100%);
      border-color: #2ec4b6;
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .syllable-blocks {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 100%;
      max-width: 100%;
      flex-wrap: nowrap;
    }

    /* 초대형 글자 슬롯 칸 (flex: 1 1 0 + min-width: 0 으로 가로 넘침 0% 보장!) */
    .syllable-slot {
      flex: 1 1 0;
      min-width: 0;
      max-width: clamp(82px, 24vw, 136px);
      height: clamp(82px, 24vw, 136px);
      background: #fff;
      border: 3.5px dashed #ffb3d1;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(3rem, 10.5vw, 5.2rem);
      color: #d0b8c8;
      transition: all 0.2s ease;
    }

    /* 4~5글자 이름일 때 한 줄에 꽉 차도록 대형 크기 유지 */
    .syllable-blocks.len-medium .syllable-slot {
      max-width: clamp(60px, 17vw, 104px);
      height: clamp(72px, 19vw, 114px);
      font-size: clamp(2.2rem, 7.2vw, 3.8rem);
      border-radius: 15px;
    }

    /* 6글자 이상(예: 프린세스 하츄핑)일 때 한 줄 맞춤 */
    .syllable-blocks.len-long .syllable-slot {
      max-width: clamp(44px, 12.5vw, 80px);
      height: clamp(60px, 15.5vw, 92px);
      font-size: clamp(1.65rem, 5.2vw, 2.9rem);
      border-radius: 12px;
    }

    /* 지금 맞춰야 하는 타겟 빈칸 */
    .syllable-slot.active-target {
      border: 3.5px solid #ff9f1c;
      background: #fff9db;
      color: #ff9f1c;
      box-shadow: 0 0 0 4px rgba(255, 159, 28, 0.22);
      animation: targetPulse 1s ease-in-out infinite;
    }

    @keyframes targetPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    /* 아이가 맞춰서 쏙 들어간 글자 칸 */
    .syllable-slot.filled {
      border: 3px solid #2ec4b6;
      background: #fff;
      color: #d81b60;
      box-shadow: 0 4px 0 #2ec4b6;
      cursor: pointer;
    }

    .syllable-slot.just-filled {
      animation: slotSnapIn 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.35);
    }

    @keyframes slotSnapIn {
      0% { transform: translateY(35px) scale(0.4); opacity: 0; }
      70% { transform: translateY(-5px) scale(1.14); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* 끝에 고정으로 들어가 있는 '핑' 칸 */
    .syllable-slot.fixed-ping {
      border: 3px solid #ff85b3;
      background: #ffe4ef;
      color: #c2185b;
      box-shadow: 0 4px 0 #f48fb1;
      cursor: pointer;
    }

    /* 아래쪽: 1단계 4지선다 버튼 그리드 (2x2, minmax(0,1fr)로 좌우 넘침 원천 차단!) */
    .choices-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    /* 2단계: 6개 한글 음절 카드 그리드 (3x2) */
    .choices-grid.syllable-mode {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .choice-btn {
      font-family: inherit;
      font-size: clamp(1.25rem, 4.7vw, 2.1rem);
      padding: clamp(10px, 1.8vh, 16px) 8px;
      border-radius: 18px;
      border: 3px solid #ffb3d1;
      background: #fff;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      box-shadow: 0 5px 0 #f48fb1;
      transition: transform 0.1s ease, background 0.15s, border-color 0.15s;
      min-height: 60px;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    /* 큰 한글 낱글자 카드 버튼 (2단계 퍼즐용 — 후보 글자 크기 확대!) */
    .syllable-card-btn {
      font-family: inherit;
      font-size: clamp(2.4rem, 8.8vw, 3.6rem);
      line-height: 1;
      padding: clamp(8px, 1.5vh, 14px) 0;
      border-radius: 20px;
      border: 3.5px solid #c77dff;
      background: linear-gradient(180deg, #ffffff 0%, #f8f0ff 100%);
      color: #4a148c;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 #9d4edd, 0 8px 14px rgba(157, 78, 221, 0.16);
      transition: transform 0.1s ease, background 0.15s, border-color 0.15s;
      min-height: 66px;
      width: 100%;
      min-width: 0;
    }

    .syllable-card-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #9d4edd;
    }

    /* 틀렸을 때 부르르 진동하며 튕겨나가는 모션 */
    .syllable-card-btn.reject-shake {
      background: #ffe3e3 !important;
      border-color: #ff4d6d !important;
      color: #c9184a !important;
      box-shadow: 0 4px 0 #ff4d6d !important;
      animation: rejectVibrate 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes rejectVibrate {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-9px, -3px) rotate(-5deg); }
      30% { transform: translate(9px, 2px) rotate(5deg); }
      45% { transform: translate(-8px, -2px) rotate(-4deg); }
      60% { transform: translate(8px, 2px) rotate(4deg); }
      75% { transform: translate(-5px, 0) rotate(-2deg); }
      90% { transform: translate(5px, 0) rotate(2deg); }
    }

    .choice-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #f48fb1;
    }

    .choice-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffe0ec;
      color: #d81b60;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .choice-text {
      flex: 1;
      min-width: 0;
      text-align: center;
      line-height: 1.15;
      word-break: keep-all;
      padding-right: 4px;
    }

    /* 1번째 눌렀을 때(소리 듣기 및 선택 대기 상태) 강조 스타일 */
    .choice-btn.selected {
      background: #fff8cc !important;
      border-color: #ff9f1c !important;
      color: #b45309 !important;
      box-shadow: 0 5px 0 #f59e0b !important;
      transform: translateY(-2px);
    }

    .choice-btn.selected .choice-num {
      background: #ff9f1c;
      color: #fff;
    }

    .choice-btn.correct {
      background: #d8f3dc !important;
      border-color: #2ec4b6 !important;
      color: #0f5132 !important;
      box-shadow: 0 5px 0 #2ec4b6 !important;
      animation: pulseCorrect 0.45s ease;
    }

    .choice-btn.wrong {
      background: #ffe3e3 !important;
      border-color: #ff6b6b !important;
      color: #a4161a !important;
      box-shadow: 0 3px 0 #ff6b6b !important;
      opacity: 0.6;
      animation: shakeWrong 0.35s ease;
    }

    @keyframes pulseCorrect {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* 하단 1줄 상태 & 카운트다운 바 */
    .feedback-banner {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .feedback-msg {
      font-size: clamp(0.96rem, 3.3vw, 1.25rem);

": "번개 풍선껌(악동핑) / 꽃가루 및 촉수 제어(앙대핑)", "img": "image/1기_캐치_티니핑/44-2_앙대핑.png"}];

    // 전체 티니핑 이름에서 추출한 고유 한글 음절 목록 ('핑' 제외, 글자 카드 오답 보기용)

    function clearAutoNextTimers() {
      if (autoNextTimer) {
        clearTimeout(autoNextTimer);
        autoNextTimer = null;
      }
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }

    function initDecor() {
      const decor = document.getElementById('bg-decor');
      const icons = ['💖', '⭐', '🌸', '✨', '🎀', '💎', '👑'];
      for (let i = 0; i < 14; i++) {
        const span = document.createElement('span');
        span.className = 'floating-icon';
        span.textContent = icons[i % icons.length];
        span.style.left = (Math.random() * 96) + 'vw';
        span.style.animationDuration = (9 + Math.random() * 8) + 's';
        span.style.animationDelay = (-Math.random() * 12) + 's';
        decor.appendChild(span);
      }
    }
    initDecor();

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.22, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.28);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.28);
          });
        } else if (type === 'pop') {
          // 글자 카드가 빈칸에 쏙 들어갈 때의 경쾌한 퐁! 효과음
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.14);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'wrong') {
          // 글자 카드가 틀려서 진동하며 튕겨나갈 때의 통통 부저 효과음
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.22);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gain.gain.setValueAtTime(0.22, now + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 0.35);
          });
        }
      } catch (e) {}
    }

    let currentAudio = null;

    function stopCurrentVoice() {
      if (currentAudio) {
        try {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        } catch (e) {}
        currentAudio = null;
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
    }

    function fallbackSpeak(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ko-KR';
        utter.rate = 1.05;
        utter.pitch = 1.65;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function playVoiceFile(relPath, fallbackText, force = false) {
      if (!ttsEnabled && !force) return;
      stopCurrentVoice();
      try {
        const audio = new Audio(relPath);
        currentAudio = audio;
        audio.onerror = () => fallbackSpeak(fallbackText);
        audio.play().catch(() => fallbackSpeak(fallbackText));
      } catch (e) {
        fallbackSpeak(fallbackText);
      }
    }

    function speakName(name, force = false) {
      playVoiceFile(`audio/names/${encodeURIComponent(name)}.mp3`, name, force);
    }

    function speakCorrect(name, force = false) {
      playVoiceFile(`audio/correct/${encodeURIComponent(name)}.mp3`, `${name} 정답이에요`, force);
    }

    function speakWrong(force = false) {
      playVoiceFile(`audio/common/wrong.mp3`, `틀렸습니다!`, force);
    }

    function speakChar(ch, force = false) {
      playVoiceFile(`audio/chars/${encodeURIComponent(ch)}.mp3`, ch, force);
    }

    function speakHint(name, keyword, force = false) {
      playVoiceFile(`audio/hints/${encodeURIComponent(name)}.mp3`, `힌트! ${keyword}의 티니핑이에요.`, force);
    }

    function setQuestionCount(count, btnEl) {
      selectedLimit = count;
      document.querySelectorAll('.settings-bar .setting-group:first-child .pill-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
    }

    function toggleTTS() {
      ttsEnabled = !ttsEnabled;
      const btn = document.getElementById('tts-toggle-btn');
      if (ttsEnabled) {
        btn.classList.add('active');
        btn.textContent = '하츄핑 목소리 켜짐 🔊';
        playVoiceFile('audio/common/tts_on.mp3', '하츄핑 목소리가 켜졌어요, 츄!', true);
      } else {
        btn.classList.remove('active');
        btn.textContent = '꺼짐 🔇';
        stopCurrentVoice();
      }
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startGame(seasonMode) {
      clearAutoNextTimers();
      currentSeasonMode = seasonMode;
      if (seasonMode === 'all') {
        pool = [...TEENIEPINGS];
      } else {
        pool = TEENIEPINGS.filter(item => item.season === seasonMode);
      }

      const shuffled = shuffle(pool);
      const count = Math.min(selectedLimit, shuffled.length);
      questions = shuffled.slice(0, count);
      currentIndex = 0;
      score = 0;
      learnedList = [];

      showScreen('quiz-screen');
      renderQuestion();
    }

    function restartSameMode() {
      startGame(currentSeasonMode);
    }

    function goHome() {
      clearAutoNextTimers();
      stopCurrentVoice();
      showScreen('home-screen');
    }

    function renderQuestion() {
      clearAutoNextTimers();
      answeredCurrent = false;
      selectedChoiceName = null;
      const q = questions[currentIndex];

      document.getElementById('progress-pill').textContent = `${currentIndex + 1}/${questions.length}`;
      document.getElementById('score-pill').textContent = `💖${score}`;
      const pct = ((currentIndex) / questions.length) * 100;
      document.getElementById('progress-fill').style.width = `${pct}%`;

      document.getElementById('char-season-badge').textContent = `${q.season}기·${q.grade}`;

      const stageEl = document.getElementById('image-stage');
      stageEl.classList.remove('puzzle-mode');

      const imgEl = document.getElementById('quiz-image');
      imgEl.src = q.img;
      imgEl.alt = q.name;

      const hintBox = document.getElementById('hint-box');
      hintBox.classList.remove('show');
      hintBox.innerHTML = `<strong>✨ ${q.keyword}</strong> — ${q.desc}`;

      const learnBox = document.getElementById('syllable-learn-box');
      learnBox.classList.remove('show', 'completed');

      document.getElementById('feedback-msg').textContent = '한 번 누르면 읽어주고, 두 번 누르면 정답 선택!';
      document.getElementById('next-btn').classList.remove('show');

      const otherCandidates = pool.filter(item => item.name !== q.name);
      const uniqueNamesMap = new Map();
      shuffle(otherCandidates).forEach(item => {
        if (!uniqueNamesMap.has(item.name)) {
          uniqueNamesMap.set(item.name, item);
        }
      });
      const distractors = Array.from(uniqueNamesMap.values()).slice(0, 3);
      const options = shuffle([q, ...distractors]);

      const grid = document.getElementById('choices-grid');
      grid.classList.remove('syllable-mode');
      grid.innerHTML = '';

      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `
          <span class="choice-num">${idx + 1}</span>
          <span class="choice-text">${opt.name}</span>
        `;
        btn.onclick = () => handleChoice(btn, opt, q);
        grid.appendChild(btn);
      });
    }

    function speakCurrentAnswer() {
      const q = questions[currentIndex];
      speakName(q.name, true);
    }

    function toggleHint() {
      const hintBox = document.getElementById('hint-box');
      hintBox.classList.toggle('show');
      const q = questions[currentIndex];
      if (hintBox.classList.contains('show')) {
        speakHint(q.name, q.keyword, true);
      } else {
        stopCurrentVoice();
      }
    }

    function handleChoice(btnEl, selectedOpt, correctOpt) {
      if (answeredCurrent) return;

      // 1번째 터치: 소리만 읽어주고 선택 대기 상태로 표시
      if (selectedChoiceName !== selectedOpt.name) {
        selectedChoiceName = selectedOpt.name;
        document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
        btnEl.classList.add('selected');
        speakName(selectedOpt.name, true);
        document.getElementById('feedback-msg').innerHTML =
          `🔊 <strong>"${selectedOpt.name}"</strong> — 맞으면 한 번 더 눌러주세요!`;
        return;
      }

      // 2번째 연속 터치: 정답 제출로 인식!
      btnEl.classList.remove('selected');
      selectedChoiceName = null;

      if (selectedOpt.name === correctOpt.name) {
        answeredCurrent = true;
        btnEl.classList.add('correct');
        playSound('correct');
        speakName(correctOpt.name, true);

        // 1단계 정답 맞힘 -> 2단계 한글 글자 카드 순서대로 맞추기 시작!
        startSyllablePuzzle(correctOpt);
      } else {
        btnEl.classList.add('wrong');
        btnEl.disabled = true;
        playSound('wrong');
        speakWrong(true);
        document.getElementById('feedback-msg').innerHTML =
          `❌ <strong>틀렸습니다!</strong> 다른 버튼을 눌러보세요 💕`;
      }
    }

    // ==================== 2단계: 한글 글자 카드 순서대로 맞추기 퍼즐 ====================
    function startSyllablePuzzle(correctOpt) {
      document.getElementById('hint-box').classList.remove('show');
      document.getElementById('image-stage').classList.add('puzzle-mode');

      const chars = Array.from(correctOpt.name);
      puzzleSlots = chars.map((ch, idx) => {
        if (ch === ' ') {
          return { char: ' ', isSpace: true, fixed: true, filled: true };
        }
        // 맨 마지막 '핑' 글자는 문제로 내지 않고 고정으로 넣어둠!
        const isLastPing = (idx === chars.length - 1 && ch === '핑');
        return {
          char: ch,
          isSpace: false,
          fixed: isLastPing,
          filled: isLastPing,
          justFilled: false
        };
      });

      const learnBox = document.getElementById('syllable-learn-box');
      learnBox.classList.remove('completed');
      learnBox.classList.add('show');

      // 첫 번째로 맞춰야 할 빈칸 찾기
      puzzleTargetIndex = puzzleSlots.findIndex(s => !s.filled);

      if (puzzleTargetIndex === -1) {
        // 만약 맞춰야 할 글자가 없다면 바로 완료 처리
        finishSyllablePuzzle(correctOpt);
      } else {
        renderPuzzleSlots();
        renderSyllableChoices(correctOpt);
      }
    }

    function renderPuzzleSlots() {
      const blocksWrap = document.getElementById('syllable-blocks');
      blocksWrap.innerHTML = '';

      const nonSpaceCount = puzzleSlots.filter(s => !s.isSpace).length;
      blocksWrap.classList.remove('len-medium', 'len-long');
      if (nonSpaceCount >= 6) {
        blocksWrap.classList.add('len-long');
      } else if (nonSpaceCount >= 4) {
        blocksWrap.classList.add('len-medium');
      }

      puzzleSlots.forEach((slot, idx) => {
        if (slot.isSpace) {
          const sp = document.createElement('div');
          sp.style.width = '8px';
          blocksWrap.appendChild(sp);
          return;
        }

        const el = document.createElement('div');
        el.className = 'syllable-slot';

        if (slot.fixed) {
          el.classList.add('fixed-ping');
          el.textContent = slot.char;
          el.onclick = () => speakChar(slot.char, true);
        } else if (slot.filled) {
          el.classList.add('filled');
          if (slot.justFilled) {
            el.classList.add('just-filled');
            slot.justFilled = false;
          }
          el.textContent = slot.char;
          el.onclick = () => speakChar(slot.char, true);
        } else if (idx === puzzleTargetIndex) {
          el.classList.add('active-target');
          el.textContent = '?';
        } else {
          el.textContent = '?';
        }

        blocksWrap.appendChild(el);
      });
    }

    function renderSyllableChoices(correctOpt) {
      const targetChar = puzzleSlots[puzzleTargetIndex].char;
      document.getElementById('feedback-msg').innerHTML =
        `🧩 빈칸에 들어갈 <strong>"${targetChar}"</strong> 글자 카드를 찾아 눌러보세요!`;

      // 임의의 다른 한글 음절 5개 + 정답 음절 1개 = 총 6개 카드 구성
      const distractorPool = ALL_SYLLABLES.filter(ch => ch !== targetChar && ch !== '핑');
      const distractors = shuffle(distractorPool).slice(0, 5);
      const cardChars = shuffle([targetChar, ...distractors]);

      const grid = document.getElementById('choices-grid');
      grid.classList.add('syllable-mode');
      grid.innerHTML = '';

      cardChars.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'syllable-card-btn';
        btn.textContent = ch;
        btn.onclick = () => handleSyllableCardClick(btn, ch, correctOpt);
        grid.appendChild(btn);
      });
    }

    function handleSyllableCardClick(btnEl, clickedChar, correctOpt) {
      if (puzzleTargetIndex === -1) return;
      const targetSlot = puzzleSlots[puzzleTargetIndex];

      if (clickedChar === targetSlot.char) {
        // 맞았을 때: 경쾌한 효과음 + 글자 음성 + 빈칸에 쏙 들어감!
        playSound('pop');
        speakChar(clickedChar, true);

        targetSlot.filled = true;
        targetSlot.justFilled = true;

        // 다음 빈칸 찾기
        puzzleTargetIndex = puzzleSlots.findIndex(s => !s.filled);
        renderPuzzleSlots();

        if (puzzleTargetIndex === -1) {
          // 모든 글자 카드를 순서대로 다 맞췄을 때!
          finishSyllablePuzzle(correctOpt);
        } else {
          // 다음 글자 맞추기 카드 6개 새로 띄우기
          renderSyllableChoices(correctOpt);
        }
      } else {
        // 틀렸을 때: 효과음과 함께 글자 카드가 부르르 진동하면서 안 들어가는 모션!
        playSound('wrong');
        btnEl.classList.remove('reject-shake');
        void btnEl.offsetWidth; // 리플로우로 애니메이션 재실행 보장
        btnEl.classList.add('reject-shake');
      }
    }

    function finishSyllablePuzzle(correctOpt) {
      score++;
      learnedList.push(correctOpt);
      document.getElementById('score-pill').textContent = `💖${score}`;
      document.getElementById('progress-fill').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

      document.getElementById('syllable-learn-box').classList.add('completed');

      // 하단 카드 버튼 비활성화 및 정답 축하 표시
      document.querySelectorAll('.syllable-card-btn').forEach(b => {
        b.disabled = true;
        b.style.opacity = '0.5';
      });

      setTimeout(() => {
        playSound('correct');
        fireConfetti(45);
        speakCorrect(correctOpt.name, true);
      }, 280);

      // 5초 카운트다운 후 자동으로 다음 문제로 이동
      let remainSec = 5;
      const feedbackEl = document.getElementById('feedback-msg');
      const nextBtn = document.getElementById('next-btn');
      nextBtn.classList.add('show');
      feedbackEl.innerHTML = `🎉 <strong>${correctOpt.name} 완성!</strong> (${remainSec}초 뒤 다음 문제)`;

      countdownInterval = setInterval(() => {
        remainSec -= 1;
        if (remainSec > 0) {
          feedbackEl.innerHTML = `🎉 <strong>${correctOpt.name} 완성!</strong> (${remainSec}초 뒤 다음 문제)`;
        }
      }, 1000);

      autoNextTimer = setTimeout(() => {
        nextQuestion();
      }, 5000);
    }

    function nextQuestion() {
      clearAutoNextTimers();
      currentIndex++;
      if (currentIndex >= questions.length) {
        showResults();
      } else {
        renderQuestion();
      }
    }

    function showResults() {
      clearAutoNextTimers();
      showScreen('result-screen');
      playSound('fanfare');
      fireConfetti(80);
      playVoiceFile('audio/common/finish.mp3', '우와! 문제를 모두 풀었어요! 정말 잘했어요, 츄!');

      document.getElementById('result-score-text').innerHTML =
        `총 <strong>${questions.length}</strong>명의 티니핑 친구 이름을 모두 배웠어요! 💖`;

      const grid = document.getElementById('learned-grid');
      grid.innerHTML = '';
      learnedList.forEach(item => {
        const chip = document.createElement('div');
        chip.className = 'learned-chip';
        chip.innerHTML = `<img src="${item.img}" alt="${item.name}" /> <span>${item.name} 🔊</span>`;
        chip.onclick = () => speakName(item.name, true);
        grid.appendChild(chip);
      });
    }

    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti(count = 40) {
      const colors = ['#ff5c93', '#ffca3a', '#00bbf9', '#9b5de5', '#2ec4b6', '#ff9f1c'];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: window.innerWidth / 2 + (Math.random() - 0.5) * 160,
          y: window.innerHeight * 0.4,
          vx: (Math.random() - 0.5) * 13,
          vy: -Math.random() * 11 - 4,
          size: 7 + Math.random() * 7,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          vrot: (Math.random() - 0.5) * 12,
          life: 70 + Math.random() * 30
        });
      }
      if (particles.length === count) {
        requestAnimationFrame(updateConfetti);
      }
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.rot += p.vrot;
        p.life -= 1;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        ctx.restore();
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length > 0) {
        requestAnimationFrame(updateConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
  </script>
